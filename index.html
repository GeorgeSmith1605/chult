<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chult Survival Tracker — D&D 5e</title>
    <style>
        :root {
            --bg-dark: #0b130e;
            --panel-bg: #142219;
            --panel-border: #233a2b;
            --accent-gold: #d4af37;
            --accent-green: #2e7d32;
            --accent-red: #c62828;
            --accent-blue: #0288d1;
            --text-main: #e0e8e2;
            --text-muted: #8ca392;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lang-btn {
            background: var(--panel-border);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 0.9rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .res-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
        }

        .res-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff;
            margin: 4px 0;
        }

        .btn-group-sm {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 4px;
        }

        .btn-sm {
            background: var(--panel-border);
            color: var(--text-main);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-sm:active {
            background: var(--accent-gold);
            color: #000;
        }

        select, input[type="text"], input[type="number"] {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .btn-main {
            width: 100%;
            background: linear-gradient(180deg, #388e3c, #1b5e20);
            color: #fff;
            border: 1px solid #4caf50;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            margin-top: 6px;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--panel-border);
            color: var(--text-main);
            border: 1px solid var(--text-muted);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .roster-list {
            list-style: none;
            margin-bottom: 10px;
        }

        .roster-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 6px;
            border-left: 3px solid var(--accent-gold);
        }

        .roster-info {
            font-size: 0.85rem;
        }

        .roster-info small {
            color: var(--text-muted);
            display: block;
        }

        .btn-del {
            background: transparent;
            color: var(--accent-red);
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 6px;
        }

        .log-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 8px;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 2px;
        }

        .badge {
            background: var(--accent-gold);
            color: #000;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Chult Tracker</h1>
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
    </header>

    <!-- STATUS & DAY ADVANCE -->
    <div class="card">
        <div class="card-title">
            <span><span id="t-day">День</span> <strong id="dayVal" style="color:var(--accent-gold);">1</strong></span>
            <span class="badge" id="weatherBadge">Сонячно</span>
        </div>
        
        <div class="grid-2" style="margin-bottom: 10px;">
            <div class="res-box">
                <div style="font-size:0.8rem; color:var(--text-muted);" id="t-food">Їжа (Раціони)</div>
                <div class="res-value" id="foodVal">0</div>
                <div class="btn-group-sm">
                    <button class="btn-sm" onclick="addFood(-5)">-5</button>
                    <button class="btn-sm" onclick="addFood(-1)">-1</button>
                    <button class="btn-sm" onclick="addFood(1)">+1</button>
                    <button class="btn-sm" onclick="addFood(5)">+5</button>
                </div>
            </div>
            <div class="res-box">
                <div style="font-size:0.8rem; color:var(--text-muted);" id="t-water">Вода (Галони)</div>
                <div class="res-value" id="waterVal">0</div>
                <div class="btn-group-sm">
                    <button class="btn-sm" onclick="addWater(-5)">-5</button>
                    <button class="btn-sm" onclick="addWater(-1)">-1</button>
                    <button class="btn-sm" onclick="addWater(1)">+1</button>
                    <button class="btn-sm" onclick="addWater(5)">+5</button>
                </div>
            </div>
        </div>

        <div class="flex-between" style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">
            <span id="t-weight">Загальна вага запасу:</span>
            <strong id="weightVal" style="color: var(--text-main);">0 lb</strong>
        </div>

        <button class="btn-main" onclick="advanceDay()" id="t-btn-next-day">Наступний день (Списати)</button>
        <button class="btn-secondary" onclick="undo()" style="width:100%; margin-top:6px;" id="t-btn-undo">Скасувати останній день (Undo)</button>
    </div>

    <!-- ENVIRONMENT & PACE -->
    <div class="card">
        <div class="card-title" id="t-title-env">Погода та Пересування</div>
        <div class="grid-2" style="margin-bottom: 8px;">
            <div>
                <label style="font-size:0.75rem; color:var(--text-muted);" id="t-lbl-weather">Погода</label>
                <select id="weatherSelect" onchange="updateSettings()">
                    <option value="sunny">Сонячна спека (2x Води)</option>
                    <option value="rain">Звичайний дощ</option>
                    <option value="heavy_rain">Тропічна злива (+Водозбір)</option>
                </select>
            </div>
            <div>
                <label style="font-size:0.75rem; color:var(--text-muted);" id="t-lbl-catchers">Водозбірники</label>
                <input type="number" id="rainCatchers" value="0" min="0" onchange="updateSettings()">
            </div>
        </div>
        <div>
            <label style="font-size:0.75rem; color:var(--text-muted);" id="t-lbl-pace">Темп пересування</label>
            <select id="paceSelect" onchange="updateSettings()">
                <option value="normal">Нормальний (1 гекс/день)</option>
                <option value="fast">Швидкий (-5 Пасивна увага)</option>
                <option value="slow">Повільний (Прихований/Search)</option>
            </select>
        </div>
    </div>

    <!-- PARTY ROSTER -->
    <div class="card">
        <div class="card-title">
            <span id="t-title-roster">Склад Загону</span>
            <span id="rosterCount" style="font-size:0.8rem; color:var(--text-muted);">0 чол.</span>
        </div>
        
        <ul class="roster-list" id="rosterList"></ul>

        <div style="display:grid; grid-template-columns: 2fr 1.5fr 1fr; gap: 6px;">
            <input type="text" id="memberName" placeholder="Ім'я / Назва">
            <select id="memberType">
                <option value="player">Гравець (1x)</option>
                <option value="guide">Гід / NPC (1x)</option>
                <option value="dino_small">Динозавр малий (2x)</option>
                <option value="dino_large">Трицератопс/В'ючний (4x)</option>
            </select>
            <button class="btn-secondary" onclick="addMember()" id="t-btn-add">+ Додати</button>
        </div>
    </div>

    <!-- LOG -->
    <div class="card">
        <div class="card-title" id="t-title-log">Журнал подій</div>
        <div class="log-box" id="logBox"></div>
    </div>

    <script>
        const MULTIPLIERS = {
            player: 1,
            guide: 1,
            dino_small: 2,
            dino_large: 4
        };

        const TRANSLATIONS = {
            uk: {
                day: "День",
                food: "Їжа (Раціони)",
                water: "Вода (Галони)",
                weight: "Загальна вага запасу:",
                btnNextDay: "Наступний день (Списати)",
                btnUndo: "Скасувати останній день (Undo)",
                titleEnv: "Погода та Пересування",
                lblWeather: "Погода",
                lblCatchers: "Водозбірники (шт)",
                lblPace: "Темп пересування",
                titleRoster: "Склад Загону",
                btnAdd: "+ Додати",
                titleLog: "Журнал подій",
                weatherSunny: "Сонячна спека (2x Води)",
                weatherRain: "Звичайний дощ",
                weatherHeavy: "Тропічна злива (+Водозбір)",
                paceNormal: "Нормальний (1 гекс/день)",
                paceFast: "Швидкий (-5 Пасивна увага)",
                paceSlow: "Повільний (Прихований/Search)",
                optPlayer: "Гравець (1x)",
                optGuide: "Гід / NPC (1x)",
                optDinoSmall: "Динозавр малий (2x)",
                optDinoLarge: "Трицератопс/В'ючний (4x)",
                placeholderName: "Ім'я / Назва",
                badgeSunny: "Сонячно",
                badgeRain: "Дощ",
                badgeHeavy: "Злива",
                logStart: "Запуск трекера Чулту.",
                logAdvance: "День {day}: Списано {food} їжі, {water} води.",
                logRainBonus: "Водозбірники зібрали +{water} гал. води!",
                logWarnFood: "УВАГА: Не вистачило їжі!",
                logWarnWater: "УВАГА: Не вистачило води! Кидайте Виснаження.",
                logUndo: "Дію скасовано. Повернуто День {day}."
            },
            en: {
                day: "Day",
                food: "Food (Rations)",
                water: "Water (Gallons)",
                weight: "Total Supply Weight:",
                btnNextDay: "Advance Day (Consume)",
                btnUndo: "Undo Last Day",
                titleEnv: "Environment & Travel",
                lblWeather: "Weather",
                lblCatchers: "Rain Catchers (qty)",
                lblPace: "Travel Pace",
                titleRoster: "Party Roster",
                btnAdd: "+ Add",
                titleLog: "Event Log",
                weatherSunny: "Sunny Heat (2x Water)",
                weatherRain: "Normal Rain",
                weatherHeavy: "Downpour (+Catchers)",
                paceNormal: "Normal (1 hex/day)",
                paceFast: "Fast (-5 Passive Perception)",
                paceSlow: "Slow (Stealth/Search)",
                optPlayer: "Player (1x)",
                optGuide: "Guide / NPC (1x)",
                optDinoSmall: "Small Dino (2x)",
                optDinoLarge: "Pack Triceratops (4x)",
                placeholderName: "Name / Unit",
                badgeSunny: "Sunny",
                badgeRain: "Rain",
                badgeHeavy: "Downpour",
                logStart: "Chult Tracker initialized.",
                logAdvance: "Day {day}: Consumed {food} food, {water} water.",
                logRainBonus: "Rain Catchers collected +{water} gal. of water!",
                logWarnFood: "WARNING: Out of food!",
                logWarnWater: "WARNING: Out of water! Roll Exhaustion.",
                logUndo: "Action undone. Reverted to Day {day}."
            }
        };

        let state = {
            lang: localStorage.getItem('toa_lang') || 'uk',
            day: 1,
            food: 20,
            water: 30,
            weather: 'sunny',
            rainCatchers: 0,
            pace: 'normal',
            roster: [
                { id: 1, name: "Гравець 1", type: "player" },
                { id: 2, name: "В'ючний Динозавр", type: "dino_large" }
            ],
            logs: []
        };

        let historyStack = [];

        function saveState() {
            localStorage.setItem('toa_state', JSON.stringify(state));
            localStorage.setItem('toa_lang', state.lang);
        }

        function pushHistory() {
            historyStack.push(JSON.stringify(state));
            if (historyStack.length > 5) historyStack.shift();
        }

        function loadState() {
            const saved = localStorage.getItem('toa_state');
            if (saved) {
                try { state = JSON.parse(saved); } catch(e){}
            }
            if (!state.logs || state.logs.length === 0) {
                state.logs = [TRANSLATIONS[state.lang].logStart];
            }
        }

        function toggleLanguage() {
            state.lang = state.lang === 'uk' ? 'en' : 'uk';
            saveState();
            render();
        }

        function addFood(val) {
            pushHistory();
            state.food = Math.max(0, state.food + val);
            saveState();
            render();
        }

        function addWater(val) {
            pushHistory();
            state.water = Math.max(0, state.water + val);
            saveState();
            render();
        }

        function addMember() {
            const nameInput = document.getElementById('memberName');
            const typeSelect = document.getElementById('memberType');
            const name = nameInput.value.trim();
            if (!name) return;

            pushHistory();
            state.roster.push({
                id: Date.now(),
                name: name,
                type: typeSelect.value
            });
            nameInput.value = '';
            saveState();
            render();
        }

        function removeMember(id) {
            pushHistory();
            state.roster = state.roster.filter(m => m.id !== id);
            saveState();
            render();
        }

        function updateSettings() {
            state.weather = document.getElementById('weatherSelect').value;
            state.rainCatchers = parseInt(document.getElementById('rainCatchers').value) || 0;
            state.pace = document.getElementById('paceSelect').value;
            saveState();
            render();
        }

        function advanceDay() {
            pushHistory();
            const t = TRANSLATIONS[state.lang];
            let totalUnits = state.roster.reduce((sum, m) => sum + (MULTIPLIERS[m.type] || 1), 0);
            
            let foodNeeded = totalUnits * 1;
            let waterMultiplier = state.weather === 'sunny' ? 2 : 1;
            let waterNeeded = totalUnits * 1 * waterMultiplier;

            state.food -= foodNeeded;
            state.water -= waterNeeded;

            let logMsg = t.logAdvance.replace('{day}', state.day).replace('{food}', foodNeeded).replace('{water}', waterNeeded);
            state.logs.unshift(logMsg);

            if (state.weather === 'heavy_rain' && state.rainCatchers > 0) {
                let collected = state.rainCatchers * 2;
                state.water += collected;
                state.logs.unshift(t.logRainBonus.replace('{water}', collected));
            }

            if (state.food < 0) {
                state.logs.unshift(t.logWarnFood);
                state.food = 0;
            }
            if (state.water < 0) {
                state.logs.unshift(t.logWarnWater);
                state.water = 0;
            }

            state.day++;
            saveState();
            render();
        }

        function undo() {
            if (historyStack.length === 0) return;
            const previous = historyStack.pop();
            state = JSON.parse(previous);
            const t = TRANSLATIONS[state.lang];
            state.logs.unshift(t.logUndo.replace('{day}', state.day));
            saveState();
            render();
        }

        function render() {
            const t = TRANSLATIONS[state.lang];
            document.getElementById('langBtn').innerText = state.lang === 'uk' ? 'EN' : 'UA';

            // Static Labels
            document.getElementById('t-day').innerText = t.day;
            document.getElementById('t-food').innerText = t.food;
            document.getElementById('t-water').innerText = t.water;
            document.getElementById('t-weight').innerText = t.weight;
            document.getElementById('t-btn-next-day').innerText = t.btnNextDay;
            document.getElementById('t-btn-undo').innerText = t.btnUndo;
            document.getElementById('t-title-env').innerText = t.titleEnv;
            document.getElementById('t-lbl-weather').innerText = t.lblWeather;
            document.getElementById('t-lbl-catchers').innerText = t.lblCatchers;
            document.getElementById('t-lbl-pace').innerText = t.lblPace;
            document.getElementById('t-title-roster').innerText = t.titleRoster;
            document.getElementById('t-btn-add').innerText = t.btnAdd;
            document.getElementById('t-title-log').innerText = t.titleLog;

            // Values
            document.getElementById('dayVal').innerText = state.day;
            document.getElementById('foodVal').innerText = state.food;
            document.getElementById('waterVal').innerText = state.water;

            // Weight calculation (1 ration = 2lb, 1 gallon water = 8.35lb)
            let totalWeight = Math.round((state.food * 2) + (state.water * 8.35));
            document.getElementById('weightVal').innerText = `${totalWeight} lb`;

            // Weather badge
            const badge = document.getElementById('weatherBadge');
            if (state.weather === 'sunny') {
                badge.innerText = t.badgeSunny;
                badge.style.background = 'var(--accent-gold)';
            } else if (state.weather === 'rain') {
                badge.innerText = t.badgeRain;
                badge.style.background = 'var(--accent-blue)';
            } else {
                badge.innerText = t.badgeHeavy;
                badge.style.background = '#0056b3';
                badge.style.color = '#fff';
            }

            // Options translation
            document.getElementById('weatherSelect').innerHTML = `
                <option value="sunny" ${state.weather==='sunny'?'selected':''}>${t.weatherSunny}</option>
                <option value="rain" ${state.weather==='rain'?'selected':''}>${t.weatherRain}</option>
                <option value="heavy_rain" ${state.weather==='heavy_rain'?'selected':''}>${t.weatherHeavy}</option>
            `;
            document.getElementById('paceSelect').innerHTML = `
                <option value="normal" ${state.pace==='normal'?'selected':''}>${t.paceNormal}</option>
                <option value="fast" ${state.pace==='fast'?'selected':''}>${t.paceFast}</option>
                <option value="slow" ${state.pace==='slow'?'selected':''}>${t.paceSlow}</option>
            `;
            document.getElementById('memberType').innerHTML = `
                <option value="player">${t.optPlayer}</option>
                <option value="guide">${t.optGuide}</option>
                <option value="dino_small">${t.optDinoSmall}</option>
                <option value="dino_large">${t.optDinoLarge}</option>
            `;
            document.getElementById('memberName').placeholder = t.placeholderName;
            document.getElementById('rainCatchers').value = state.rainCatchers;

            // Roster list
            const rosterList = document.getElementById('rosterList');
            rosterList.innerHTML = '';
            state.roster.forEach(m => {
                let li = document.createElement('li');
                li.className = 'roster-item';
                li.innerHTML = `
                    <div class="roster-info">
                        <strong>${m.name}</strong>
                        <small>${MULTIPLIERS[m.type] || 1}x споживання</small>
                    </div>
                    <button class="btn-del" onclick="removeMember(${m.id})">✕</button>
                `;
                rosterList.appendChild(li);
            });
            document.getElementById('rosterCount').innerText = `${state.roster.length} units`;

            // Logs
            const logBox = document.getElementById('logBox');
            logBox.innerHTML = state.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
        }

        // Init
        loadState();
        render();
    </script>
</body>
</html>
